# Web frontend service ONLY (app.beyondcode.ai dashboard + password gate)
#
# Create a SEPARATE Railway service for this — do NOT reuse the orchestrator
# service (voice-loom-bot). Point Root Directory to repo root (/).
#
# Orchestrator healthcheck lives in orchestrator/railway.toml (/health).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
